[project]
name = "rag-core"
version = "0.1.0"
description = "Local hybrid-search RAG core package"
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=3.0.0,<6.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_core*"]
